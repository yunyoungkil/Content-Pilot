<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Pilot Editor</title>
    <!-- Quill Snow Theme CSS (로컬) -->
    <link href="lib/quill.snow.css" rel="stylesheet" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden; /* 아이프레임 외부 스크롤 제거 */
      }
      body {
        margin: 0;
        padding: 0; /* W-11: body 패딩 제거 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        background: white;
      }

      #editor-container {
        height: 100%;
        min-height: 0;
        max-height: 100%;
        box-sizing: border-box;
        border: none;
        border-radius: 0;
        background: white;
        overflow: hidden;
        max-width: 100vw;
      }

      .ql-container {
        height: 100%; /* 아이프레임 전체 높이 사용 */
        overflow: hidden; /* 중복 스크롤을 막기 위해 컨테이너 레벨에서 오버플로우 차단 */
        border: none;
        font-size: 14px;
        line-height: 1.6;
        box-sizing: border-box;
        width: 100%;
        max-width: 100vw;
        max-height: 100%;
        display: block;
      }

      /* W-11: 툴바 높이 자동 조정 */
      .ql-toolbar,
      .ql-toolbar.ql-snow {
        min-height: 40px;
        height: auto;
        max-height: none;
        box-sizing: border-box;
        padding: 8px !important;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        border: none !important; /* border 제거 */
        gap: 2px; /* 아이콘 간 간격 */
      }

      /* 툴바 아이콘 정렬 최적화 */
      .ql-toolbar .ql-formats {
        display: inline-flex;
        align-items: center;
        margin-right: 8px;
        vertical-align: middle;
      }

      .ql-toolbar .ql-formats:last-child {
        margin-right: 0;
      }

      /* 툴바 버튼 정렬 개선 */
      .ql-toolbar button,
      .ql-toolbar .ql-picker {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        margin: 0;
      }

      /* 툴바 버튼 간격 조정 */
      .ql-toolbar button + button,
      .ql-toolbar .ql-picker + button,
      .ql-toolbar button + .ql-picker {
        margin-left: 0;
      }

      /* 툴바 구분선 추가 (선택사항) */
      .ql-toolbar .ql-formats:not(:last-child)::after {
        content: '';
        width: 1px;
        height: 20px;
        background-color: #e0e0e0;
        margin-left: 4px;
        margin-right: 4px;
      }

      /* 링크 밑줄 제거 및 스타일 */
      .ql-editor a {
        text-decoration: none !important;
        color: #1a73e8;
      }
      .ql-editor a:hover {
        text-decoration: underline !important;
      }
      
      /* 중요한 문장 배경색 스타일 */
      .ql-editor mark {
        background-color: rgb(255, 255, 204) !important;
        padding: 2px 4px;
        border-radius: 3px;
      }
      
      /* 인용 블록 스타일 및 줄간격 */
      .ql-editor blockquote {
        border-left: 4px solid #4285f4;
        padding-left: 16px;
        padding-top: 8px;
        padding-bottom: 8px;
        margin-left: 0;
        margin-right: 0;
        margin-top: 16px;
        margin-bottom: 16px;
        color: #666;
        font-style: italic;
        line-height: 1.8;
        background-color: #f8f9fa;
      }
      
      .ql-editor blockquote p {
        margin-bottom: 8px;
      }
      
      .ql-editor blockquote p:last-child {
        margin-bottom: 0;
      }
      
      /* 제목 태그 스타일 및 줄간격 */
      .ql-editor h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.4;
        margin-top: 0;
        margin-bottom: 16px;
        color: #1a1a1a;
      }
      
      .ql-editor h2 {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.5;
        margin-top: 32px;
        margin-bottom: 16px;
        color: #2a2a2a;
      }
      
      .ql-editor h3 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.5;
        margin-top: 24px;
        margin-bottom: 12px;
        color: #333;
      }
      
      .ql-editor h4 {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.5;
        margin-top: 20px;
        margin-bottom: 10px;
        color: #444;
      }
      
      /* h1 아래 구분선 */
      .ql-editor h1 + hr {
        border: none;
        border-top: 2px solid #e0e0e0;
        margin: 24px 0 32px 0;
      }
      
      /* 문단 간격 및 줄간격 */
      .ql-editor p {
        margin-bottom: 16px;
        line-height: 1.8;
        color: #333;
      }
      
      /* 목록 들여쓰기 및 줄간격 */
      .ql-editor ul,
      .ql-editor ol {
        padding-left: 24px;
        margin-bottom: 16px;
        line-height: 1.8;
      }
      
      .ql-editor ul li,
      .ql-editor ol li {
        margin-bottom: 8px;
        line-height: 1.8;
      }
      
      .ql-editor {
        box-sizing: border-box;
        width: 100%;
        min-height: 0; /* W-11: Flexbox 오버플로우 방지 */
        padding: 16px;
        color: #333;
        overflow-y: auto; /* 편집기 내부 스크롤만 허용 */
        overflow-x: hidden;
        overflow-wrap: break-word;
      }

      .ql-editor.ql-blank::before {
        color: #aaa;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div id="editor-container"></div>

    <!-- Quill JS Library (로컬) -->
    <script src="lib/quill.js"></script>
    <script src="lib/quill-image-resize.min.js"></script>
    <script src="dist/editor.bundle.js"></script>
  </body>
</html>
